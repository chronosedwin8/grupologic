# Configuración de ejemplo de Nginx para grupologiclatam.com
# Copiar a /etc/nginx/sites-available/ y enlazar en sites-enabled/.
# Ajuste las rutas de los certificados (por ejemplo, generados con Certbot / Let's Encrypt)
# y la ruta raíz donde haya subido el contenido de la carpeta "sitio/".

# 1) HTTP → HTTPS (con y sin www)
server {
    listen 80;
    listen [::]:80;
    server_name grupologiclatam.com www.grupologiclatam.com;

    # Necesario para renovar certificados con Certbot (webroot)
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://grupologiclatam.com$request_uri; }
}

# 2) https://www → https:// dominio raíz
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.grupologiclatam.com;

    ssl_certificate     /etc/letsencrypt/live/grupologiclatam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grupologiclatam.com/privkey.pem;

    return 301 https://grupologiclatam.com$request_uri;
}

# 3) Sitio principal
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grupologiclatam.com;

    root /var/www/grupologiclatam.com;   # contenido de la carpeta "sitio/"
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/grupologiclatam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grupologiclatam.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Cabeceras de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript
               text/javascript image/svg+xml application/manifest+json;
    # Si el servidor tiene el módulo brotli, puede activarse además:
    # brotli on; brotli_types text/css application/javascript image/svg+xml application/json;

    # Tipo correcto para el manifiesto
    types { application/manifest+json webmanifest; }

    # URLs limpias: /soluciones/unticloud/ → /soluciones/unticloud/index.html
    location / {
        try_files $uri $uri/ =404;
    }

    # HTML: siempre revalidar para publicar cambios al instante
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # CSS y JS llevan ?v=<huella> desde el build: caché larga e inmutable
    location ~* \.(?:css|js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Fuentes e imágenes
    location ~* \.(?:woff2|webp|avif|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Datos y archivos para buscadores: caché corta
    location ~* \.(?:json|xml|txt|webmanifest)$ {
        expires 1h;
    }

    # Página 404 personalizada
    error_page 404 /404.html;
    location = /404.html { internal; }

    # No servir archivos ocultos
    location ~ /\. { deny all; }
}
